services:
  postgres:
    image: postgres:17-alpine
    container_name: ms-postgres
    environment:
      POSTGRES_DB: users_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ms-postgres-volume:/var/lib/postgresql/data
    networks:
      - ms-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  user-service:
    image: ghcr.io/solo157/ms-user-service:latest
    container_name: ms-user-service
    ports:
      - "8081:8081"
    networks:
      - ms-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8081/health | grep -q 'OK' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/users_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

  client-service:
    image: ghcr.io/solo157/ms-client-service:latest
    container_name: ms-client-service
    ports:
      - "8082:8082"
    networks:
      - ms-network
    depends_on:
      user-service:
        condition: service_healthy

volumes:
  ms-postgres-volume:

networks:
  ms-network:
    driver: bridge
