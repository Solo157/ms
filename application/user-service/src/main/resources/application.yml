spring:
  application:
    name: user-service
  # In-memory БД H2 для демо: внешний PostgreSQL-инстанс не нужен.
  datasource:
    url: jdbc:h2:mem:userdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: 8081

# Monitoring: expose health + prometheus metrics. The custom /health endpoint is
# kept for backward compatibility; the probes use the actuator health groups.
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    # Общий тег application позволяет Grafana/Prometheus различать сервисы.
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        # Гистограмма задержек HTTP — для p50/p95/p99 latency-панелей в Grafana.
        http.server.requests: true

# Логи структурированным JSON (ECS) в stdout — Loki/Alloy собирают stdout пода,
# Grafana извлекает service.name (= spring.application.name) как метку потока.
logging:
  structured:
    format:
      console: ecs


