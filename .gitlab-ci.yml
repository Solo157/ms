# Two independent pipelines in one project:
#   - Infrastructure (Terraform + cluster bootstrap + monitoring) on terraform/
#     helm/monitoring/**, kubernetes/** changes.
#   - Application (build/test/package/deploy) on application/** and
#     helm/application/** changes.
# rules:changes below keeps a Java change from ever triggering `terraform apply`.

workflow:
  rules:
    # Skip duplicate branch pipeline when an MR is open for the same branch.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

default:
  tags: [yc-runner]
  interruptible: true

stages:
  - validate
  - plan
  - apply
  - bootstrap
  - build
  - test
  - package
  - deploy-dev
  - verify
  - deploy-prod

include:
  - local: .gitlab/ci/infrastructure.yml
  - local: .gitlab/ci/application.yml
