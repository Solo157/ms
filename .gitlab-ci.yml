# Pipeline ТОЛЬКО приложения: build -> (docker) image -> deploy.
# Развёртывание инфраструктуры (кластер, ingress, мониторинг) в этот проект НЕ входит —
# стенд и ingress подготавливаются снаружи. Cluster-хост приложения подаётся переменной
# INGRESS_HOST, доступ к кластеру — временным kubeconfig-ом от YC-SA (кластер уже создан).

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

default:
  tags: [yc-runner]

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  # Имя уже существующего кластера (его готовит оператор снаружи) — нужно только
  # чтобы получить kubeconfig через `yc get-credentials`.
  CLUSTER_NAME: "otus-ms-cluster"
  # Внешний ingress-хост приложения (задаёт оператор в переменных GitLab).
  # INGRESS_HOST не задаём здесь ищет значение из настроек CI/CD.

stages:
  - build
  - image
  - deploy

# --- Приложение --------------------------------------------------------------
# Все команды — в Makefile. В Alpine-образах ниже make/curl ставятся отдельно.
build_application:
  stage: build
  image: maven:3.9-eclipse-temurin-21
  # Первый прикладной job — запускается вручную; дальше app-цепочка идёт
  # автоматически, каждый job ждёт предыдущий через `needs` у следующих jobs.
  rules:
    - when: manual
  cache: { key: maven, paths: [.m2/repository] }
  # В образе maven:* на Debian slim нет make — ставим, иначе `make build`
  # падает с `make: command not found` (exit 127). Alpine-джобы (build_images,
  # deploy_application) делают то же самое через `apk add`.
  before_script:
    - apt-get update -qq && apt-get install -y --no-install-recommends make
  script:
    - make build
  artifacts:
    paths:
      - application/user-service/target/app.jar
      - application/client-service/target/app.jar

# Публикация образов — только после успешной сборки.
build_images:
  stage: image
  image: docker:27
  services: [docker:27-dind]
  needs: [build_application]
  timeout: 30m
  before_script:
    - apk add --no-cache make
  variables:
    # DOCKER_TLS_CERTDIR="" принудительно отключает TLS у dind-демона: он
    # слушает 0.0.0.0:2375 без сертификатов. Обходной путь для связок, где
    # авто-вайринг GitLab Runner (DOCKER_HOST=tcp://docker:2376 +
    # DOCKER_CERT_PATH=/certs/client) не срабатывает. Требует `privileged=true`
    # на Runner'е.
    # ВАЖНО: DOCKER_TLS_VERIFY и DOCKER_CERT_PATH здесь НИ В КОЕМ СЛУЧАЕ не
    # задаём (даже как ""). Docker CLI включает TLS по факту «переменная
    # определена и непустая», поэтому "0" для него == "1"; при DOCKER_TLS_VERIFY=0
    # клиент пойдёт искать /root/.docker/ca.pem и упадёт с
    # `unable to resolve docker endpoint: open /root/.docker/ca.pem`.
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
  script:
    - docker version  # быстрый self-check, что клиент видит 2375 dind
    - make docker-build docker-push

# Установка приложения: helm-релиз в namespace dev. Ждёт build_images (needs).
# Доступ к кластеру — временный kubeconfig от YC-SA (кластер и ingress готовы
# снаружи). INGRESS_HOST берётся из переменной CI/CD.
deploy_application:
  stage: deploy
  image:
    name: dtzar/helm-kubectl:3
    entrypoint: [""]
  needs: [build_images]
  environment: { name: dev }
  resource_group: cluster
  # Доступ к кластеру — временный kubeconfig от YC-SA.
  # KUBE_CONTEXT="" -> make app-deploy не добавляет --kube-context, helm берёт
  # current-context из $KUBECONFIG.
  variables:
    KUBECONFIG: "$CI_PROJECT_DIR/kubeconfig"
    KUBE_CONTEXT: ""
  before_script:
    - apk add --no-cache make curl
    - curl -fsSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i /opt/yc -n >/dev/null
    - export PATH="/opt/yc/bin:$PATH"
    - yc config profile create ci >/dev/null 2>&1 || true
    - yc config profile activate ci
    - yc config set folder-id "$YC_FOLDER_ID"
    - yc config set service-account-key "$YC_SA_KEY"
    - umask 077 && yc managed-kubernetes cluster get-credentials --name "$CLUSTER_NAME" --external --force --kubeconfig "$KUBECONFIG"
  after_script:
    - rm -f "$KUBECONFIG"
  script:
    - test -n "$INGRESS_HOST" || { echo "INGRESS_HOST не задан в переменных CI/CD"; exit 1; }
    - make app-deploy app-smoke
