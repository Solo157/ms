# Prometheus + Grafana + kube-state-metrics + node-exporter. Без отказоустойчивости
# и долгого хранения. Alertmanager отключён: для демо достаточно сбора и визуализации.

alertmanager:
  enabled: false

grafana:
  adminPassword: admin              # только для демо; в настоящем окружении — секрет
  resources:
    requests: { cpu: 20m, memory: 128Mi }
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - PLACEHOLDER_GRAFANA_HOST     # CI: --set grafana.ingress.hosts[0]=...
    paths: [ / ]
    pathType: Prefix
  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki.logging.svc.cluster.local:3100

prometheus:
  prometheusSpec:
    retention: 2d
    resources:
      requests: { cpu: 100m, memory: 256Mi }
    # Искать ServiceMonitor во всех namespace и не смотреть на метки релиза —
    # иначе метрики приложения из namespace dev не соберутся.
    serviceMonitorSelectorNilUsesHelmValues: false

nodeExporter:
  resources:
    requests: { cpu: 10m, memory: 32Mi }

kube-state-metrics:
  resources:
    requests: { cpu: 10m, memory: 64Mi }

defaultRules:
  create: false
