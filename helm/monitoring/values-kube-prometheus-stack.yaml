# Минимальный, но рабочий мониторинг для OTUS-демо.
# Ставит Prometheus, Grafana, kube-state-metrics, node-exporter, kubelet.
# Релиз ставится в namespace `monitoring`; без HA/долгого хранения/автоскейлинга.
# Alertmanager отключен: Prometheus+Grafana достаточно для сбора и визуализации.

alertmanager:
  enabled: false

grafana:
  enabled: true
  adminPassword: admin            # только для демо; в «реале» переопределять в CI
  resources:
    requests: { cpu: 20m, memory: 128Mi }
  # Grafana наружу через nginx-ingress (хост подставляет пайплайн как $GRAFANA_HOST).
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - PLACEHOLDER_GRAFANA_HOST
    paths:
      - /
    pathType: Prefix
  # Регистрируем Loki (namespace logging) источником данных, чтобы логи были в
  # той же Grafana. URL согласован с именем релиза/namespace (см. install-cluster-
  # components): Service `loki` в monitoring->logging = loki.logging.svc.
  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki.logging.svc.cluster.local:3100
      isDefault: false

prometheus:
  enabled: true
  prometheusSpec:
    retention: 2d                 # размер под демо
    resources:
      requests: { cpu: 100m, memory: 256Mi }
    storageSpec: {}               # ephemeral PVC для демо не нужен
    # Ищем ServiceMonitors / PodMonitors во всех namespace и со всеми лейблами,
    # чтобы метрики приложения работали без совпадения лейблов release.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}
    podMonitorNamespaceSelector: {}

nodeExporter:
  enabled: true
  resources:
    requests: { cpu: 10m, memory: 32Mi }

kube-state-metrics:
  resources:
    requests: { cpu: 10m, memory: 64Mi }

# kubelet-метрики и cAdvisor включены в чарте по умолчанию — здесь не трогаем.

# Alertmanager полностью отключён — правил алертов и конфигураций AM не создаём.
defaultRules:
  create: false

