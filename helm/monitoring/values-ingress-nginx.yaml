# nginx-ingress: контроллер получает внешний IP (YC LoadBalancer). На этом IP
# строятся адреса демо через nip.io: service.<IP>.nip.io, например
#   grafana.<IP>.nip.io, app.<IP>.nip.io  (nip.io переводит адрес вида IP.nip.io в этот IP).
controller:
  replicaCount: 1
  service:
    type: LoadBalancer
    annotations:
      # TLS на балансировщике YC не включаем: демо работает по HTTP.
      yandex.cloud/ssl-enabled: "false"
  resources:
    requests: { cpu: 20m, memory: 90Mi }
