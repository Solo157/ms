# Grafana Loki in single-binary mode with local filesystem storage (demo).
# Not scalable — that is fine for the course objective.
loki:
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: 2024-01-01
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  storage:
    type: filesystem
    bucket: loki-data
  limits_config:
    retention_period: 48h
    ingestion_rate_mb: 8
    ingestion_burst_size_mb: 16

deploymentMode: SingleBinary
singleBinary:
  replicas: 1
  resources:
    requests: { cpu: 50m, memory: 256Mi }
  persistence:
    enabled: true
    size: 5Gi

# Disable the separately-scaling components we don't need in single-binary mode.
backend:
  enabled: false
read:
  enabled: false
write:
  enabled: false

service:
  type: ClusterIP
