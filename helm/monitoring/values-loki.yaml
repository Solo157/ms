# Grafana Loki в одноподном (SingleBinary / Monolithic) режиме: одна реплика,
# локальное файловое хранилище (демо). Ставится в namespace `logging`, Service
# `loki` на порту 3100. Отдельные backend/read/write не используются — для учебной
# задачи этого достаточно.
loki:
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: 2024-01-01
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  storage:
    type: filesystem
    bucket: loki-data
  limits_config:
    retention_period: 48h
    ingestion_rate_mb: 8
    ingestion_burst_size_mb: 16

deploymentMode: SingleBinary
singleBinary:
  replicas: 1
  resources:
    requests: { cpu: 50m, memory: 256Mi }
  persistence:
    enabled: true
    size: 5Gi

# Отдельно масштабируемые компоненты выключены — в одноподном режиме они не нужны.
# В новом Loki helm-чарте их replicas тоже обязаны быть 0, иначе проверка чарта не
# проходит.
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

service:
  type: ClusterIP
