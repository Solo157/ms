# Grafana Alloy — сборщик логов подов кластера, один Deployment (реплики = 1, НЕ
# DaemonSet). Используется loki.source.kubernetes: Alloy читает логи подов через
# Kubernetes API (watch), поэтому один экземпляр видит поды во всём кластере.
# Никаких hostPath и дублей (подхват строго по API-объекту pod/container).
#
# Namespace: logging. Локи: http://loki.logging.svc.cluster.local:3100/push.
#
# RBAC (ServiceAccount + ClusterRole с pods + pods/log) создаётся чартом по
# умолчанию (rbac.create=true); отдельно не трогаем — усложнять не нужно.

controller:
  type: deployment
  replicas: 1

# Фиксируем образ (appVersion чарта v1.15.0 == alloy v1.21.3).
image:
  tag: v1.21.3

alloy:
  # Речевой (River) конфиг подаём через ConfigMap контента чарта: при непустом
  # content чарт НЕ подставляет свой дефолт, а кладёт этот текст в config.alloy.
  # (Прошло через tpl — здесь нет скобок {{ }}.)
  configMap:
    create: true
    content: |
      logging {
        level  = "info"
        format = "logfmt"
      }

      # Все поды кластера через API (watch) — обнаружение без hostPath.
      discovery.kubernetes "pods" {
        role = "pod"
      }

      # Читаем stdout каждого контейнера; метки namespace/pod/container добавляет
      # сам loki.source.kubernetes из metadata подов.
      loki.source.kubernetes "pods" {
        targets    = discovery.kubernetes.pods.targets
        forward_to = [loki.process.pods.receiver]
      }

      # Минимальная обработка: шумные лейблы срезаем, stream-атрибуты
      # (namespace, pod, container) сохраняем.
      loki.process "pods" {
        stage.labeldrop = ["job", "instance"]
        forward_to      = [loki.write.loki.receiver]
      }

      loki.write "loki" {
        endpoint {
          url = "http://loki.logging.svc.cluster.local:3100/loki/api/v1/push"
        }
      }

resources:
  requests: { cpu: 20m, memory: 128Mi }
