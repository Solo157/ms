# Grafana Alloy — сборщик логов подов кластера. Один Deployment (replicas: 1, НЕ
# DaemonSet): loki.source.kubernetes читает логи через API Kubernetes, поэтому
# одного экземпляра хватает на все поды кластера. Namespace: logging.
# Путь логов: loki.source.kubernetes -> loki.write, без промежуточной обработки.

controller:
  type: deployment
  replicas: 1

image:
  tag: v1.21.3

alloy:
  configMap:
    create: true
    content: |
      logging {
        level  = "info"
        format = "logfmt"
      }

      discovery.kubernetes "pods" {
        role = "pod"
      }

      # namespace/pod/container-метки добавляет сам loki.source.kubernetes.
      loki.source.kubernetes "pods" {
        targets    = discovery.kubernetes.pods.targets
        forward_to = [loki.write.loki.receiver]
      }

      loki.write "loki" {
        endpoint {
          url = "http://loki.logging.svc.cluster.local:3100/loki/api/v1/push"
        }
      }

resources:
  requests: { cpu: 20m, memory: 128Mi }
