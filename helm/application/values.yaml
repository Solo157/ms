# Shared defaults. Environment overrides live in values-dev.yaml / values-prod.yaml.
# Image tag is injected by the pipeline: --set image.tag=$CI_COMMIT_SHA
image:
  registry: cr.yandex/REPLACE_REGISTRY_ID
  pullPolicy: IfNotPresent

userService:
  enabled: true
  name: user-service
  port: 8081
  replicas: 1
  image:
    repository: ms-user-service
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 512Mi }

clientService:
  enabled: true
  name: client-service
  port: 8082
  replicas: 1
  image:
    repository: ms-client-service
  resources:
    requests: { cpu: 50m, memory: 192Mi }
    limits:   { cpu: 300m, memory: 384Mi }

# Spring datasource is injected via env SPRING_DATASOURCE_URL/USERNAME/PASSWORD.
db:
  host: postgres
  port: 5432
  name: users_db
  user: postgres
  password: postgres
  # If set, credentials come from this Secret's data (keys: username, password).
  existingSecret: ""

# PostgreSQL is deployed by the DEV release only; PROD reuses the same instance
# (values-prod sets postgres.enabled=false and db.host=postgres.<dev-ns>.svc).
postgres:
  enabled: true
  image: postgres:17-alpine
  size: 2Gi
  storageClass: ""            # "" -> cluster default
  resources:
    requests: { cpu: 50m, memory: 128Mi }

ingress:
  enabled: true
  className: nginx
  host: PLACEHOLDER_HOST      # filled by pipeline (nip.io)
  path: /

metrics:
  enabled: true               # create ServiceMonitors (needs kube-prometheus-stack CRDs)
  labels:
    release: kube-prometheus  # harmless even when selectors are set to match-all
