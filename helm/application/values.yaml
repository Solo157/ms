# Значения чарта приложения. Всё, что меняется между запусками/реестрами,
# подставляет CI через --set (см. Makefile app-deploy). Имена и порты сервисов —
# константы и записаны прямо в шаблонах.

image:
  registry: registry.example.com/ms   # CI: --set image.registry=$CI_REGISTRY_IMAGE
  tag: latest                         # CI: --set image.tag=$CI_COMMIT_SHA

# Secret gitlab-registry (kubernetes.io/dockerconfigjson) создаётся всегда.
# Значения подставляет CI: deploy-токен read_registry (CI_DEPLOY_USER/PASSWORD).
registry:
  server: ""
  username: ""
  password: ""
  secretName: gitlab-registry

# Хост приложения: LB ingress-nginx + nip.io, подставляет CI.
ingress:
  host: PLACEHOLDER_HOST

user:
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 512Mi }

client:
  replicas: 1
  resources:
    requests: { cpu: 50m, memory: 192Mi }
    limits:   { cpu: 300m, memory: 384Mi }
