{{- $auth := printf "%s:%s" .Values.registry.username .Values.registry.password | b64enc -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.registry.secretName }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ printf `{"auths":{"%s":{"username":"%s","password":"%s","auth":"%s"}}}` .Values.registry.server .Values.registry.username .Values.registry.password $auth | b64enc | quote }}
