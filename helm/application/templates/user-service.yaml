apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.userService.name }}
  labels:
    {{- include "ms.labels" . | nindent 4 }}
    app: {{ .Values.userService.name }}
spec:
  replicas: {{ .Values.userService.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.userService.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.userService.name }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.userService.port }}"
        prometheus.io/path: "/actuator/prometheus"
        redeploy-timestamp: "{{ now | unixEpoch }}"
    spec:
      imagePullSecrets:
        - name: {{ .Values.registry.secretName }}
      containers:
        - name: {{ .Values.userService.name }}
          image: "{{ .Values.image.registry }}/{{ .Values.userService.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.userService.port }}
          # In-memory H2 — внешний источник данных не требуется, ENV не задаём.
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: {{ .Values.userService.port }} }
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: {{ .Values.userService.port }} }
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            {{- toYaml .Values.userService.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.userService.name }}
  labels:
    {{- include "ms.labels" . | nindent 4 }}
    app: {{ .Values.userService.name }}
spec:
  selector:
    app: {{ .Values.userService.name }}
  ports:
    - name: http
      port: {{ .Values.userService.port }}
      targetPort: {{ .Values.userService.port }}
---
# Prometheus release = kube-prometheus (константа проекта) — ServiceMonitor подхватывается.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Values.userService.name }}
  labels:
    {{- include "ms.labels" . | nindent 4 }}
    app: {{ .Values.userService.name }}
    release: kube-prometheus
spec:
  selector:
    matchLabels:
      app: {{ .Values.userService.name }}
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 30s
