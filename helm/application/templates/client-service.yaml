apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.clientService.name }}
  labels:
    app: {{ .Values.clientService.name }}
spec:
  replicas: {{ .Values.clientService.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.clientService.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.clientService.name }}
    spec:
      imagePullSecrets:
        - name: {{ .Values.registry.secretName }}
      containers:
        - name: {{ .Values.clientService.name }}
          image: "{{ .Values.image.registry }}/{{ .Values.clientService.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: {{ .Values.clientService.port }}
          env:
            - name: USER_SERVICE_URL
              value: "http://user-service:8081"
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8082 }
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8082 }
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            {{- toYaml .Values.clientService.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.clientService.name }}
  labels:
    app: {{ .Values.clientService.name }}
spec:
  selector:
    app: {{ .Values.clientService.name }}
  ports:
    - name: http
      port: {{ .Values.clientService.port }}
      targetPort: {{ .Values.clientService.port }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Values.clientService.name }}
  labels:
    app: {{ .Values.clientService.name }}
spec:
  selector:
    matchLabels:
      app: {{ .Values.clientService.name }}
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 30s
